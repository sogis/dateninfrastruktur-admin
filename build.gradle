buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.apache.cayenne.plugins:cayenne-gradle-plugin:5.0-M3'; classpath 'org.postgresql:postgresql:42.7.14' }
}
plugins {
    id 'java'
    id 'gg.jte.gradle' version '3.2.4'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}
apply plugin: 'org.apache.cayenne'
group = 'ch.so.agi'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.microsoft.playwright:playwright:1.60.0'
    implementation 'org.apache.cayenne:cayenne:5.0-M3'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.platform:junit-platform-console'
}
tasks.named('test') { useJUnitPlatform() }

tasks.named('test') { exclude '**/*IT.class' }
tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    useJUnitPlatform()
}

cdbimport {
    map 'src/main/resources/cayenne/management.map.xml'
    adapter 'org.apache.cayenne.dba.postgres.PostgresAdapter'
    dataSource {
        url System.getenv('DI_MAPPING_URL') ?: 'jdbc:postgresql://127.0.0.1:1/unconfigured'
        username System.getenv('DI_MAPPING_USER') ?: 'unconfigured'
        password System.getenv('DI_MAPPING_PASSWORD') ?: ''
        driver 'org.postgresql.Driver'
    }
    dbImport {
        schema 'di_management'
        excludeTable 't_ili2db_.*'
        defaultPackage 'ch.so.agi.dateninfrastruktur.admin.model'
    }
}
cgen {
    map 'src/main/resources/cayenne/management.map.xml'
    destDir 'src/main/java'
}

tasks.named('cgen') { mustRunAfter tasks.named('cdbimport') }

tasks.register('normalizeCayenneUuid', Exec) {
    commandLine 'python3', 'scripts/normalize_cayenne_uuid.py'
    mustRunAfter tasks.named('cdbimport')
}
tasks.named('cgen') { dependsOn tasks.named('normalizeCayenneUuid') }

tasks.named('cgen') { outputs.upToDateWhen { false } }

// PostgreSQL contents and credentials are external state, not reusable task outputs.
tasks.named('integrationTest') {
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

jte { generate(); binaryStaticContent = true }
// Explicit test-profile tooling; never part of the web image or normal startup.
tasks.register('composeTestRuntime', Copy) {
    dependsOn tasks.named('testClasses')
    into layout.buildDirectory.dir('compose-test')
    into('classes') { from sourceSets.main.output; from sourceSets.test.output }
    into('lib') { from configurations.testRuntimeClasspath }
}

// Generation remains an explicit development command; normal builds never introspect a DB.
tasks.named('compileJava') { mustRunAfter tasks.named('cgen') }
tasks.named('processResources') { mustRunAfter tasks.named('cdbimport'), tasks.named('normalizeCayenneUuid') }

// The development container keeps Gradle and JTE output outside the source mount.
if (providers.gradleProperty('adminDevBuild').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('adminDevBuild').get()))
    tasks.named('bootRun') {
        workingDir '/dev-state'
        args '--spring.profiles.active=admin-dev'
    }
}
