spring.application.name=dateninfrastruktur-admin
logging.level.org.apache.cayenne.log=ERROR
logging.level.org.apache.cayenne.log.Slf4jJdbcEventLogger=OFF
logging.level.cayenne-sql=OFF
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,managementSchema
gg.jte.development-mode=false
gg.jte.use-precompiled-templates=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=256KB
